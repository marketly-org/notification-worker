apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: marketly
  labels:
    app: notification-worker
    tier: worker
  annotations:
    sentinel.io/repo: "marketly-org/notification-worker"
    sentinel.io/branch: "main"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: notification-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-worker
        tier: worker
    spec:
      containers:
        - name: app
          image: ghcr.io/marketly-org/notification-worker:sha-a4d1605
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: marketly-redis-credentials
                  key: url
            - name: SMTP_HOST
              value: "smtp.marketly.svc.cluster.local"
            - name: SMTP_PORT
              value: "2525"
            - name: SMTP_USE_TLS
              value: "true"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: marketly-smtp-credentials
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketly-smtp-credentials
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: marketly-db-credentials
                  key: notifications-url
            - name: HEALTH_PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
